<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Directory listing for KULT EDM projects">
    <title>KULT EDM Projects Directory</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
    <h1>KULT EDM Projects Directory</h1>
    <p class="directory-note">Listing auto-generated from the repository tree so every HTML deliverable stays discoverable.</p>
    <div id="directory-container" class="directory-list"></div>

    <script src="directory-data.js"></script>
    <script>
        const directoryContainer = document.getElementById('directory-container');

        const formatLabel = (value = '') => value
            .replace(/[-_]/g, ' ')
            .replace(/\s+/g, ' ')
            .replace(/\b\w/g, char => char.toUpperCase())
            .trim();

        const formatSectionLabel = (path) => {
            if (path === '_root') {
                return 'Root Files';
            }
            return path
                .split('/')
                .map(segment => formatLabel(segment))
                .join(' › ');
        };

        const deriveLinkLabel = (fileName = '', segments = [], top = '') => {
            if (fileName.toLowerCase() === 'index.html') {
                const fallback = segments[segments.length - 1] || top;
                return formatLabel(fallback);
            }
            return formatLabel(fileName.replace('.html', ''));
        };

        const buildDirectory = () => {
            if (!directoryContainer) {
                return;
            }

            const dataset = (window.directoryData || []).filter(entry => entry.Top !== 'index.html');

            const grouped = dataset.reduce((acc, entry) => {
                const segments = entry.Relative.split('/');
                const top = segments.shift();
                const fileName = segments.pop() || '';
                const sectionKey = segments.length ? segments.join('/') : '_root';

                if (!acc[top]) {
                    acc[top] = {};
                }
                if (!acc[top][sectionKey]) {
                    acc[top][sectionKey] = [];
                }

                acc[top][sectionKey].push({
                    label: deriveLinkLabel(fileName, segments, top),
                    path: entry.Relative,
                    fileName
                });

                return acc;
            }, {});

            const topLevels = Object.keys(grouped).sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));

            if (!topLevels.length) {
                const emptyMessage = document.createElement('p');
                emptyMessage.textContent = 'No HTML files were found in this repository.';
                directoryContainer.appendChild(emptyMessage);
                return;
            }

            topLevels.forEach(top => {
                const card = document.createElement('div');
                card.className = 'directory';

                const heading = document.createElement('h2');
                heading.textContent = top;
                card.appendChild(heading);

                const sectionList = document.createElement('ul');

                Object.entries(grouped[top])
                    .sort((a, b) => a[0].localeCompare(b[0], undefined, { sensitivity: 'base' }))
                    .forEach(([sectionKey, files]) => {
                        const sectionItem = document.createElement('li');
                        sectionItem.className = 'directory-section';

                        const sectionTitle = document.createElement('h4');
                        sectionTitle.textContent = formatSectionLabel(sectionKey);
                        sectionItem.appendChild(sectionTitle);

                        if (sectionKey !== '_root') {
                            const pathHint = document.createElement('p');
                            pathHint.className = 'path-hint';
                            pathHint.textContent = sectionKey;
                            sectionItem.appendChild(pathHint);
                        }

                        const fileList = document.createElement('ul');
                        fileList.className = 'file-list';

                        files
                            .sort((a, b) => a.label.localeCompare(b.label, undefined, { sensitivity: 'base', numeric: true }))
                            .forEach(file => {
                                const fileItem = document.createElement('li');

                                const link = document.createElement('a');
                                link.href = encodeURI(file.path);
                                link.target = '_blank';
                                link.rel = 'noopener';
                                link.textContent = file.label;
                                link.title = file.path;

                                fileItem.appendChild(link);
                                fileList.appendChild(fileItem);
                            });

                        sectionItem.appendChild(fileList);
                        sectionList.appendChild(sectionItem);
                    });

                card.appendChild(sectionList);
                directoryContainer.appendChild(card);
            });
        };

        buildDirectory();
    </script>
    <script>
        // GSAP Animation
        window.addEventListener('load', () => {
            // Animate title
            gsap.to('h1', {
                opacity: 1,
                duration: 1,
                ease: 'power2.out'
            });

            // Animate cards with stagger
            gsap.to('.directory', {
                opacity: 1,
                y: 0,
                duration: 0.8,
                stagger: 0.15,
                ease: 'power2.out',
                delay: 0.3
            });
        });
    </script>
</body>
</html>
